# XcodeGen manifest for the native ShotIQ SwiftUI app.
# On macOS:  brew install xcodegen && cd ios-native && xcodegen generate
# then open ShotIQ.xcodeproj and run on an iPhone simulator.
name: ShotIQ
options:
  bundleIdPrefix: com.kevinhouston
  deploymentTarget:
    iOS: "17.0"
targets:
  ShotIQ:
    type: application
    platform: iOS
    sources: [ShotIQ/App, ShotIQ/Core, ShotIQ/Components, ShotIQ/Screens]
    info:
      path: ShotIQ/App/Info.plist
      properties:
        # Version keys must reference build settings, or a hardcoded "1" ships
        # in every IPA and App Store Connect rejects it as a duplicate build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard HTTPS only — answers the export-compliance question at upload
        # time so TestFlight can hand the build out without a manual step.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true            # canonical screens hide the system status bar
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: ShotIQ analyzes your shooting form from live camera capture.
        NSMicrophoneUsageDescription: ShotIQ records audio with your shot videos for coaching playback.
        NSPhotoLibraryUsageDescription: ShotIQ imports shot photos and videos for analysis.
        NSUserNotificationsUsageDescription: ShotIQ reminds you about workouts and analysis results.
        # Wilson X Connect typography bundled in ShotIQ/App/Fonts.
        UIAppFonts:
          - boxedmedium.otf
          - boxedsemibold.otf
          - boxedheavy.otf
          - tungsten_medium.otf
          - tungsten_semibold.otf
          - tungsten_bold.otf
          - tungsten_black.otf
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        # App Store validation requires an asset-catalog app icon + CFBundleIconName;
        # the compiler injects CFBundleIconName when this points at the AppIcon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Automatic signing with Kevin's team (same team as HoopTrack), so both a
        # local Xcode run and the CI release pipeline sign without manual profiles.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DD9G8RP575
        PRODUCT_BUNDLE_IDENTIFIER: com.baller70.shotiq
        PRODUCT_NAME: "$(TARGET_NAME)"
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: iPhone Developer
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          ENABLE_TESTABILITY: YES
          GCC_OPTIMIZATION_LEVEL: 0
          ONLY_ACTIVE_ARCH: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_NS_ASSERTIONS: NO
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  ShotIQTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShotIQ/Tests]
    dependencies: [{target: ShotIQ}]
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShotIQ.app/ShotIQ"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
  ShotIQUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShotIQ/UITests]
    dependencies: [{target: ShotIQ}]
    settings:
      base:
        TEST_TARGET_NAME: ShotIQ
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: iphoneos
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

# Explicit shared scheme so xcodebuild -scheme ShotIQ works headlessly on CI
# (the release script requires xcshareddata/xcschemes/ShotIQ.xcscheme).
schemes:
  ShotIQ:
    build:
      targets:
        ShotIQ: all
    run:
      config: Debug
    test:
      config: Debug
      # ShotIQUITests carries CanonicalScreenshotTests — the screenshot +
      # click-test walk driven by scripts/simulator-screenshots.sh.
      targets: [ShotIQTests, ShotIQUITests]
    archive:
      config: Release
