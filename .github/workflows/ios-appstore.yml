name: iOS App Store

# Archives and ships the ShotIQ iOS app from a GitHub-hosted macOS runner,
# which has Xcode preinstalled. This is how the app reaches TestFlight and
# App Store Connect without a local Mac — Linux agents cannot run Xcode.
# Ported from the proven HoopTrack pipeline (baller70/hooptrack).
#
# Two ways in. workflow_dispatch, where "upload" is not the default so a stray
# click cannot ship a build. And a release tag, for callers that cannot reach
# the dispatch API — pushing `release-6` uploads build 6 and submits it.
# Creating that tag is deliberate enough to be the consent.

on:
  push:
    tags: ['release-*']
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (CFBundleVersion) — must exceed the last upload
        required: true
        type: string
      stage:
        description: How far to go
        required: true
        default: validate
        type: choice
        options: [archive, validate, upload, upload-and-submit]
      xcode_version:
        description: Xcode version to select (blank = runner default)
        required: false
        type: string

concurrency:
  group: ios-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Normalises the two entry points into one set of values.
  config:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.resolve.outputs.build_number }}
      stage: ${{ steps.resolve.outputs.stage }}
    steps:
      - name: Resolve release parameters
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            # release-<build number>
            if [[ ! "$tag" =~ ^release-([0-9]+)$ ]]; then
              echo "::error::Tag '$tag' must look like release-6 (the build number)." >&2
              exit 1
            fi
            echo "build_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "stage=upload-and-submit"         >> "$GITHUB_OUTPUT"
            echo "Tag release: build ${BASH_REMATCH[1]} -> upload-and-submit"
          else
            echo "build_number=${{ inputs.build_number }}" >> "$GITHUB_OUTPUT"
            echo "stage=${{ inputs.stage }}"               >> "$GITHUB_OUTPUT"
          fi

      # Every secret the run will need, checked here — in seconds, on a free
      # ubuntu runner — rather than partway through the macOS job.
      #
      # ASC_ISSUER_ID WAS GUARDED NOWHERE. `appstore-release.sh` needs it to
      # upload ("ASC_ISSUER_ID is not set" at line 196) and nothing asked for it
      # until that moment, so a release with it missing spun up the macOS
      # runner, installed XcodeGen, imported the signing certificate and ran the
      # full archive — twenty to forty minutes — before dying on the last step.
      # ASC_KEY_ID was only checked inside the macOS job, which is cheaper to
      # fail but still after the runner has started.
      #
      # Each missing name is printed. "Release secrets are missing" sent the
      # reader to another workflow to find out which one.
      - name: Verify release secrets are configured
        env:
          HAS_CERT: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 != '' }}
          HAS_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_P8: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
          HAS_ISSUER: ${{ secrets.ASC_ISSUER_ID != '' }}
        run: |
          missing=0
          for pair in \
            "APPLE_DIST_CERT_P12_BASE64:$HAS_CERT" \
            "ASC_KEY_ID:$HAS_KEY_ID" \
            "ASC_KEY_P8_BASE64:$HAS_P8" \
            "ASC_ISSUER_ID:$HAS_ISSUER"; do
            name="${pair%%:*}"; present="${pair##*:}"
            if [ "$present" != "true" ]; then
              echo "::error::Repository secret $name is not set. See ios-native/APP_STORE_SUBMISSION.md." >&2
              missing=1
            fi
          done
          # APPLE_DIST_CERT_PASSWORD is deliberately NOT required: a .p12 may
          # legitimately carry no password, and demanding one would block a
          # valid setup.
          [ "$missing" = "0" ] || exit 1
          echo "All required release secrets are present."

  release:
    needs: config
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: basketball-analysis/ios-native

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -n "${{ github.event.inputs.xcode_version }}" ]; then
            sudo xcode-select -s "/Applications/Xcode_${{ github.event.inputs.xcode_version }}.app"
          fi
          xcodebuild -version

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
          ls ShotIQ.xcodeproj/xcshareddata/xcschemes/

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64}" ]; then
            echo "::error::APPLE_DIST_CERT_P12_BASE64 is not set. See ios-native/APP_STORE_SUBMISSION.md." >&2
            exit 1
          fi

          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          cert_path="${RUNNER_TEMP}/dist.p12"

          printf '%s' "${CERT_P12_BASE64}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert_path}" -P "${CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychain -d user -s "${keychain}" login.keychain-db

          rm -f "${cert_path}"
          security find-identity -v -p codesigning "${keychain}"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_KEY_P8_BASE64}" ]; then
            echo "::error::ASC_KEY_ID / ASC_KEY_P8_BASE64 are not set. See ios-native/APP_STORE_SUBMISSION.md." >&2
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${ASC_KEY_P8_BASE64}" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"

      - name: Release ShotIQ
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          case "${{ needs.config.outputs.stage }}" in
            archive)
              ./release/appstore-release.sh archive --build "${{ needs.config.outputs.build_number }}"
              ./release/appstore-release.sh export
              ;;
            validate)
              ./release/appstore-release.sh archive --build "${{ needs.config.outputs.build_number }}"
              ./release/appstore-release.sh export
              ./release/appstore-release.sh validate
              ;;
            upload|upload-and-submit)
              ./release/appstore-release.sh all --build "${{ needs.config.outputs.build_number }}"
              ;;
          esac

      # Uploading only puts the binary in App Store Connect. Apple still has to
      # finish processing it before it can be attached to a version, so this
      # waits rather than failing on a build that simply is not ready yet.
      - name: Submit for review
        if: needs.config.outputs.stage == 'upload-and-submit'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund jose
          export ASC_KEY_PATH="${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          for attempt in $(seq 1 20); do
            if node release/appstore-submit-for-review.mjs shotiq \
                 --build "${{ needs.config.outputs.build_number }}" --submit; then
              exit 0
            fi
            echo "Build not ready yet (attempt ${attempt}/20); waiting 90s..."
            sleep 90
          done
          echo "::error::Build ${{ needs.config.outputs.build_number }} did not finish processing within 30 minutes." >&2
          exit 1

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shotiq-ipa-build-${{ needs.config.outputs.build_number }}
          path: basketball-analysis/ios-native/build/appstore/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Collect build logs on failure
        if: failure()
        run: |
          echo "Archive contents, if any:"
          ls -la build/appstore 2>/dev/null || echo "(no build directory)"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 2>/dev/null || true
